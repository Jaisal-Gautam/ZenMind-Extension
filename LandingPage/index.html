      <h1>ZenMind — Less switching. More deep work.</h1>
      <p>ZenMind is a free Chrome extension that helps you block distracting websites, settle into focus with ambient soundscapes, and understand how you spend your time online.</p>

      <h2>Three steps to a quieter session</h2>
      <h3>Choose a focus mode</h3>
      <p>Pick from Deep Focus, Gentle Focus, or Study Mode — each designed for a different kind of deep work.</p>
      <h3>ZenMind clears the noise</h3>
      <p>Distracting websites are blocked, ambient sounds play, and your session timer starts automatically.</p>
      <h3>Review your progress</h3>
      <p>See your focused time, peak hours, and distractions avoided in a calm insights dashboard.</p>

      <h2>A focus mode for every kind of deep work</h2>
      <p>Deep Focus blocks all distractions for maximum concentration. Gentle Focus allows occasional breaks. Study Mode uses timed intervals with rest periods.</p>

      <h2>Set the boundary once. ZenMind holds it.</h2>
      <p>Block social media, news, shopping, and entertainment sites. Customize categories or add specific URLs to your block list.</p>

      <h2>Make focus feel like a place</h2>
      <p>Choose from calming soundscapes — forest rain, ocean waves, café ambience, and more — to create your ideal focus environment.</p>

      <h2>See what your focus is becoming</h2>
      <p>Track your daily focus time, discover your peak productivity hours, and watch your Focus Forest grow as you build consistent deep work habits.</p>

      <h2>Everything is Free</h2>
      <p>ZenMind is completely free to use. No ads, no tracking, no hidden costs. Your attention and privacy come first.</p>
